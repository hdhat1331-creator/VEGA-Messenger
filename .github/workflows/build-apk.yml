name: Build VEGA APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract Phase 9 package
        shell: bash
        run: |
          set -e
          PACKAGE="VEGA_Phase9_Update_Package_FIXED.zip"

          if [ ! -f "$PACKAGE" ]; then
            echo "ERROR: $PACKAGE is missing from the repository root."
            echo "Root files:"
            find . -maxdepth 2 -type f | sort | head -200
            exit 1
          fi

          unzip -t "$PACKAGE"
          mkdir -p /tmp/vega/outer /tmp/vega/source
          unzip -o -q "$PACKAGE" -d /tmp/vega/outer

          INNER_ZIP="$(find /tmp/vega/outer -type f -name 'VEGA_Phase8_Integrated_Source.zip' -print -quit)"
          if [ -z "$INNER_ZIP" ]; then
            echo "ERROR: VEGA_Phase8_Integrated_Source.zip was not found inside Phase 9 package."
            find /tmp/vega/outer -maxdepth 5 -type f
            exit 1
          fi

          unzip -t "$INNER_ZIP"
          unzip -o -q "$INNER_ZIP" -d /tmp/vega/source

          APP_PUBSPEC="$(find /tmp/vega/source -type f -name pubspec.yaml -print -quit)"
          if [ -z "$APP_PUBSPEC" ]; then
            echo "ERROR: Flutter pubspec.yaml was not found."
            find /tmp/vega/source -maxdepth 6 -type f | head -200
            exit 1
          fi

          APP_DIR="$(dirname "$APP_PUBSPEC")"
          echo "VEGA_APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "Flutter project: $APP_DIR"

      - name: Generate Android project
        working-directory: ${{ env.VEGA_APP_DIR }}
        run: flutter create . --platforms=android

      - name: Set Android app name and internet permission
        working-directory: ${{ env.VEGA_APP_DIR }}
        run: |
          sed -i 's/android:label="[^"]*"/android:label="VEGA"/' android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml || \
            sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        working-directory: ${{ env.VEGA_APP_DIR }}
        run: flutter pub get

      - name: Generate launcher icon
        working-directory: ${{ env.VEGA_APP_DIR }}
        run: dart run flutter_launcher_icons

      - name: Build APK
        working-directory: ${{ env.VEGA_APP_DIR }}
        run: flutter build apk --release

      - name: Prepare APK
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/VEGA-APK"
          cp "${VEGA_APP_DIR}/build/app/outputs/flutter-apk/app-release.apk" \
             "${GITHUB_WORKSPACE}/VEGA-APK/VEGA.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VEGA-APK
          path: VEGA-APK/VEGA.apk
          
