
name: Build VEGA APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Find and Extract VEGA Source
        shell: bash
        run: |
          set -e

          echo "=== Repository files ==="
          find . -maxdepth 3 -type f | head -200

          echo "=== Finding ZIP packages ==="
          ZIP_FILE=""

          for name in \
            "VEGA_Phase8_UI_Chat_Logo_Update.zip" \
            "VEGA_Phase9_Update_Package.zip" \
            "VEGA_Phase8_Integrated_Source.zip"
          do
            if [ -f "$name" ]; then
              ZIP_FILE="$name"
              break
            fi
          done

          if [ -z "$ZIP_FILE" ]; then
            ZIP_COUNT=$(find . -maxdepth 1 -type f -iname '*.zip' | wc -l)

            if [ "$ZIP_COUNT" -eq 1 ]; then
              ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)
            else
              echo "ERROR: Could not identify the source ZIP."
              find . -maxdepth 2 -type f -iname '*.zip'
              exit 1
            fi
          fi

          echo "Using ZIP: $ZIP_FILE"
          unzip -t "$ZIP_FILE"

          mkdir -p /tmp/vega/source
          unzip -o -q "$ZIP_FILE" -d /tmp/vega/source

          echo "=== Extracting nested ZIP files ==="
          for level in 1 2 3; do
            NESTED=$(find /tmp/vega/source -type f -iname '*.zip' -print)

            [ -z "$NESTED" ] && break

            while IFS= read -r nested_zip; do
              echo "Extracting: $nested_zip"
              DEST="${nested_zip%.zip}_extracted"
              mkdir -p "$DEST"
              unzip -o -q "$nested_zip" -d "$DEST"
            done <<< "$NESTED"
          done

          echo "=== Finding Flutter project ==="
          APP_PUBSPEC=$(find /tmp/vega/source -type f -name pubspec.yaml -print -quit)

          if [ -z "$APP_PUBSPEC" ]; then
            echo "ERROR: Flutter pubspec.yaml was not found."
            find /tmp/vega/source -maxdepth 6 -type f | head -200
            exit 1
          fi

          APP_DIR=$(dirname "$APP_PUBSPEC")
          echo "VEGA_APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

          echo "Flutter project: $APP_DIR"

      - name: Generate Android Project
        working-directory: ${{ env.VEGA_APP_DIR }}
        run: flutter create . --platforms=android

      - name: Set App Name and Internet Permission
        working-directory: ${{ env.VEGA_APP_DIR }}
        run: |
          sed -i 's/android:label="[^"]*"/android:label="VEGA"/' android/app/src/main/AndroidManifest.xml

          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml || \
            sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml

      - name: Get Dependencies
        working-directory: ${{ env.VEGA_APP_DIR }}
        run: flutter pub get

      - name: Generate Launcher Icon
        working-directory: ${{ env.VEGA_APP_DIR }}
        run: |
          if grep -q "flutter_launcher_icons:" pubspec.yaml; then
            dart run flutter_launcher_icons
          else
            echo "Launcher icon configuration not found; skipping."
          fi

      - name: Build APK
        working-directory: ${{ env.VEGA_APP_DIR }}
        run: flutter build apk --release

      - name: Prepare APK
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/VEGA-APK"
          cp "${VEGA_APP_DIR}/build/app/outputs/flutter-apk/app-release.apk" \
             "${GITHUB_WORKSPACE}/VEGA-APK/VEGA.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VEGA-APK
          path: VEGA-APK/VEGA.apk
