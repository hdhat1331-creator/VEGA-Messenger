
name: Build VEGA APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Extract VEGA project
        run: |
          unzip -q VEGA_Phase8_Integrated_Source.zip -d /tmp/vega
          test -f /tmp/vega/VEGA_Phase8_Integrated_Source/app/pubspec.yaml

      - name: Generate Android files
        working-directory: /tmp/vega/VEGA_Phase8_Integrated_Source/app
        run: flutter create . --platforms=android

      - name: Get dependencies
        working-directory: /tmp/vega/VEGA_Phase8_Integrated_Source/app
        run: flutter pub get

      - name: Build APK
        working-directory: /tmp/vega/VEGA_Phase8_Integrated_Source/app
        run: flutter build apk --release

      - name: Prepare APK
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/VEGA-APK"
          cp /tmp/vega/VEGA_Phase8_Integrated_Source/app/build/app/outputs/flutter-apk/app-release.apk "${GITHUB_WORKSPACE}/VEGA-APK/"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VEGA-APK
          path: VEGA-APK/app-release.apk
          
